name: Nightly full mutation

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:all
